name: CI/CD Release Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Security Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate TEST_DATABASE_URL secret presence (preflight)
        run: |
          if [ -z "${TEST_DATABASE_URL}" ]; then
            echo "::error::TEST_DATABASE_URL GitHub Actions secret is not configured."
            echo "::error::Configure TEST_DATABASE_URL under Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run quality gates (format, lint, tests with coverage, audit)
        run: npm run quality
        env:
          NODE_ENV: test
          LOG_LEVEL: error
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Upload test coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 14

  docker-release:
    name: Docker Build, Security Scan & GHCR Release
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Resolve GHCR image name
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        run: |
          docker build \
            --target production \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            -t "${IMAGE_NAME}:main" \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Run Trivy container security scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/.trivyignore:/.trivyignore" \
            aquasec/trivy:0.75.0 image \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --skip-dirs /usr/local/lib/node_modules/npm \
            --ignorefile /.trivyignore \
            --exit-code 1 \
            "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Authenticate with GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish production Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Publishing immutable commit SHA tag: ${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Publishing branch tag: ${IMAGE_NAME}:main"
          docker push "${IMAGE_NAME}:main"

          echo "Publishing latest rolling tag: ${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
