apiVersion: batch/v1
kind: Job
metadata:
  name: acquisitions-migration
  namespace: acquisitions
  labels:
    app.kubernetes.io/name: acquisitions-migration
    app.kubernetes.io/part-of: acquisitions
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acquisitions-migration
        app.kubernetes.io/part-of: acquisitions
        app.kubernetes.io/component: database-migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Enable if pulling from private GHCR:
      # imagePullSecrets:
      #   - name: ghcr-pull-secret
      containers:
        - name: migration
          # Target the immutable commit SHA migration image:
          image: ghcr.io/pradnyan-khandakale/aquisitions-migration:7f23d58
          imagePullPolicy: IfNotPresent
          command: ['npm', 'run', 'db:migrate']
          envFrom:
            - configMapRef:
                name: acquisitions-config
            - secretRef:
                name: acquisitions-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
