apiVersion: v1
kind: Secret
metadata:
  name: acquisitions-secrets
  namespace: acquisitions
  labels:
    app.kubernetes.io/name: acquisitions-api
    app.kubernetes.io/part-of: acquisitions
type: Opaque
stringData:
  # Connection string for PostgreSQL (Neon Cloud) with TLS required
  # Format: postgres://<user>:<password>@<host>/<dbname>?sslmode=require
  DATABASE_URL: 'postgres://user:password@host.aws.neon.tech/acquisitions_prod?sslmode=require'

  # Cryptographically secure 256-bit random secret string for JWT signing
  JWT_SECRET: 'replace-with-a-cryptographically-secure-random-256-bit-secret'

  # Arcjet API key for rate limiting and bot detection (starts with ajkey_)
  ARCJET_KEY: 'ajkey_replace_with_valid_arcjet_key'
