# Template for pulling private images from GitHub Container Registry (GHCR)
#
# Recommended creation command (without exposing tokens in files):
# kubectl create secret docker-registry ghcr-pull-secret \
#   --docker-server=ghcr.io \
#   --docker-username=<GITHUB_USERNAME> \
#   --docker-password=<GITHUB_PAT_WITH_READ_PACKAGES> \
#   --namespace=acquisitions
#
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: acquisitions
  labels:
    app.kubernetes.io/name: acquisitions-api
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded JSON string formatted as: {"auths":{"ghcr.io":{"auth":"<base64-username:token>"}}}
  .dockerconfigjson: eyJhdXRocyI6eyJnaGNyLmlvIjp7InVzZXJuYW1lIjoiZXhhbXBsZSIsInBhc3N3b3JkIjoiZXhhbXBsZSIsImF1dGgiOiJjMlZ5ZG1samVRPT0ifX19
