apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acquisitions-ingress
  namespace: acquisitions
  labels:
    app.kubernetes.io/name: acquisitions-api
    app.kubernetes.io/part-of: acquisitions
  annotations:
    # Production ingress controller annotations (e.g. ingress-nginx)
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
    # Example cert-manager annotation for production automated TLS:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # tls:
  #   - hosts:
  #       - api.example.com
  #     secretName: acquisitions-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: acquisitions-service
                port:
                  number: 80
